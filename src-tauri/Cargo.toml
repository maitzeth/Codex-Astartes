[package]
name = "codex-astartes"
version = "1.0.0"
description = "Codex-Astartes desktop UI for the local Ollama Qwen server"
authors = ["maitzeth"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "sync", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
once_cell = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
